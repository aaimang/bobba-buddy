# Builds the Sphinx docs (strict, like locally) and publishes them to GitHub Pages
# on every push to main. Turn it on once in Settings -> Pages -> Source: GitHub Actions.
name: Docs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The settings window's modules import tkinter, which Ubuntu's Python doesn't ship.
      - run: sudo apt-get update && sudo apt-get install -y python3-tk
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --group docs
      - run: uv run --group docs sphinx-build -b html -W --keep-going -n docs/sphinx docs/sphinx/_build/html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs/sphinx/_build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
